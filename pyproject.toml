[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "py-arch-analyzer"
version = "0.1.0"
description = "Static architecture and dependency cycle analyzer for Python"
dependencies = [
    "networkx>=3.0",
    "rich>=13.0",
    "click>=8.0"
]

[project.scripts]
arch-analyze = "analyzer:main"

[tool.setuptools]
py-modules = ["analyzer"]